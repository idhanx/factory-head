# FactoryManager AI — local development stack.
#
# Five pilot plants generate a few thousand events a day, so this is one
# Postgres, one Redis, one broker and two app processes. Kubernetes is deferred
# until it is a problem (ARCHITECTURE.md §1.2).

name: factorymanager

services:
  # TimescaleDB is Postgres 16 with the hypertable extension: the capture tables
  # (downtime, production counts, quality) are time-series by nature, and the
  # owner's "last 4 weeks" queries are continuous aggregates.
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: fm-db
    # Survives a reboot: without this the API comes up and every request
    # 500s on a refused connection to 5432.
    restart: unless-stopped
    environment:
      POSTGRES_USER: factorymanager
      POSTGRES_PASSWORD: factorymanager
      POSTGRES_DB: factorymanager
      TZ: Asia/Kolkata
    ports: ["5432:5432"]
    volumes:
      - fm-db-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factorymanager -d factorymanager"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Durable *delayed* jobs for the 5/15/30-minute escalation ladder. A missed
  # 15-minute WhatsApp is a missed escalation nobody can later prove, so this
  # cannot be an in-process timer.
  redis:
    image: redis:7.4-alpine
    container_name: fm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes:
      - fm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The data-source seam (§2, §9). Nothing publishes to it at launch — it is
  # here so the hardware phase is a data-source swap, not a rebuild.
  emqx:
    image: emqx/emqx:5.8.4
    container_name: fm-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: fm-emqx
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: factorymanager
    ports:
      - "1883:1883"   # MQTT
      - "8083:8083"   # MQTT over WebSocket
      - "18083:18083" # dashboard
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fm-api
    environment:
      DATABASE_URL: postgresql+psycopg://factorymanager:factorymanager@db:5432/factorymanager
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: emqx
      MQTT_ENABLED: "true"
      ENVIRONMENT: local
      CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  # The escalation ladder, shift-close costing, Recovered Profit accrual and the
  # 5:45 AM Coach briefing all run here, off the request path.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fm-worker
    environment:
      DATABASE_URL: postgresql+psycopg://factorymanager:factorymanager@db:5432/factorymanager
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: local
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./backend:/app
    command: python -m app.workers.runner

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fm-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  fm-db-data:
  fm-redis-data:
